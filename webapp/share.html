<!DOCTYPE html>
<html lang="ru" class="tg-dark vkui--vkIOS--dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#19191a" />
  <title>{{TITLE}}</title>
  <meta name="description" content="{{LABEL}}" />
  <meta property="og:title" content="{{TITLE}}" />
  <meta property="og:description" content="{{LABEL}}" />
  <link rel="stylesheet" href="/webapp/vkui-ios-dark.css?v=20260605-browser-gate" />
  <style>
    :root {
      color-scheme: dark;
      --bg: var(--vkui--color_background, #19191a);
      --text: var(--vkui--color_text_primary, #e1e3e6);
      --muted: var(--vkui--color_text_secondary, #909499);
      --faint: var(--vkui--color_text_tertiary, #76787a);
      --border: var(--vkui--color_separator_primary, rgba(255, 255, 255, 0.12));
      --accent: var(--vkui--color_icon_accent, #529ef4);
      --surface: var(--vkui--color_background_content, #19191a);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: var(--vkui--font_family_base, -apple-system, system-ui, "Helvetica Neue", Roboto, sans-serif);
      color: var(--text);
      background: var(--bg);
    }
    .wrap {
      max-width: 46rem;
      margin: 0 auto;
      padding: 1.75rem 1.25rem 4rem;
    }
    .wrap.has-toc { max-width: 68rem; }
    .wrap.has-comments { max-width: 72rem; }
    .wrap.has-toc.has-comments { max-width: 88rem; }
    .share-doc-row {
      min-width: 0;
    }
    .share-toc {
      margin: 0 0 1rem;
      padding: 0.5rem;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.04);
    }
    .share-toc-title {
      margin: 0;
      padding: 0.5rem 0.625rem;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .share-toc-list {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .share-toc-link {
      --toc-indent: 0px;
      display: block;
      min-height: 36px;
      padding: 0.5rem 0.625rem 0.5rem calc(0.625rem + var(--toc-indent));
      border-radius: 10px;
      color: var(--muted);
      font-size: 0.875rem;
      line-height: 1.35;
      overflow-wrap: break-word;
      text-decoration: none;
    }
    .share-toc-link:active,
    .share-toc-link:focus {
      color: var(--accent);
      background: rgba(82, 158, 244, 0.14);
      outline: none;
    }
    .share-toc-link--level-1,
    .share-toc-link--level-2 { --toc-indent: 0px; }
    .share-toc-link--level-3 { --toc-indent: 14px; }
    .share-toc-link--level-4 { --toc-indent: 28px; font-size: 0.8125rem; }
    .share-toc-link--level-5,
    .share-toc-link--level-6 { --toc-indent: 42px; font-size: 0.8125rem; }
    .label {
      margin: 0 0 0.75rem;
      color: var(--muted);
      font-size: 0.75rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    #share-title {
      margin: 0 0 0.65rem;
      padding: 0;
      color: var(--text);
      font-size: var(--vkui--font_title1--font_size--regular, 24px);
      font-weight: var(--vkui--font_title1--font_weight--regular, 600);
      line-height: var(--vkui--font_title1--line_height--regular, 28px);
      letter-spacing: -0.01em;
      overflow-wrap: anywhere;
    }
    .share-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin: 0 0 1rem;
    }
    .share-actions.hidden { display: none; }
    .share-actions-btn {
      min-height: 36px;
      padding: 0.4rem 0.85rem;
      border: none;
      border-radius: 10px;
      color: #fff;
      background: var(--accent);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .share-actions-btn--ghost {
      color: var(--text);
      background: rgba(255, 255, 255, 0.08);
    }
    .share-actions-status {
      width: 100%;
      margin: 0;
      color: var(--muted);
      font-size: 0.8125rem;
    }
    #share-body {
      color: var(--text);
      background: transparent;
      overflow-wrap: anywhere;
      word-break: break-word;
      font-size: var(--vkui--font_paragraph--font_size--regular, 15px);
      font-weight: var(--vkui--font_paragraph--font_weight--regular, 400);
      line-height: var(--vkui--font_paragraph--line_height--regular, 20px);
    }
    #share-body > :first-child { margin-top: 0; }
    #share-body > :last-child { margin-bottom: 0; }
    #share-body h1,
    #share-body h2,
    #share-body h3,
    #share-body h4,
    #share-body h5,
    #share-body h6 {
      margin: 0.75rem 0 0.375rem;
      font-size: inherit;
      font-weight: 700;
      line-height: 1.3;
    }
    #share-body p { margin: 0.375rem 0; }
    #share-body ul,
    #share-body ol {
      margin: 0.375rem 0;
      padding-left: 1.25rem;
    }
    #share-body li { margin: 0.25rem 0; }
    #share-body li > p { margin: 0; }
    #share-body blockquote {
      margin: 0.375rem 0;
      padding-left: 0.75rem;
      border-left: 3px solid var(--border);
      color: var(--muted);
    }
    #share-body a { color: var(--accent); }
    #share-body strong, #share-body b { font-weight: 600; }
    #share-body em, #share-body i { font-style: italic; }
    #share-body s, #share-body del, #share-body strike { text-decoration: line-through; }
    #share-body u { text-decoration: underline; }
    #share-body img,
    #share-body .note-editor-image {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 0.75rem 0;
      border-radius: 12px;
    }
    #share-body table {
      width: 100%;
      margin: 0.75rem 0;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 0.875rem;
    }
    #share-body th,
    #share-body td {
      padding: 0.4rem 0.5rem;
      border: 1px solid var(--border);
      text-align: left;
      vertical-align: top;
      word-break: break-word;
    }
    #share-body th {
      font-weight: 600;
      background: rgba(255, 255, 255, 0.06);
    }
    #share-body ul.note-task-list,
    #share-body ul[data-type="taskList"] {
      list-style: none;
      margin: 0.375rem 0;
      padding-left: 0;
    }
    #share-body .note-task,
    #share-body ul[data-type="taskList"] > li {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      margin: 0.25rem 0;
      list-style: none;
    }
    #share-body .note-task::marker,
    #share-body ul[data-type="taskList"] > li::marker { content: ""; }
    #share-body .note-task > label,
    #share-body ul[data-type="taskList"] li > label {
      display: inline-flex;
      flex: 0 0 auto;
      margin: 0;
    }
    #share-body ul[data-type="taskList"] li > label > span { display: none; }
    #share-body .note-task input[type="checkbox"],
    #share-body ul[data-type="taskList"] li input[type="checkbox"] {
      flex-shrink: 0;
      width: 1rem;
      height: 1rem;
      margin: 0.15rem 0 0;
      accent-color: var(--accent);
    }
    #share-body .note-task-text {
      flex: 1 1 auto;
      min-width: 0;
      line-height: 1.45;
    }
    #share-body .note-task-text > p { margin: 0; display: inline; }
    #share-body .note-task--checked .note-task-text,
    #share-body ul[data-type="taskList"] li[data-checked="true"] > div,
    #share-body ul[data-type="taskList"] li[data-checked="true"] p {
      text-decoration: line-through;
      color: var(--faint);
    }
    #share-body ul[data-type="taskList"] li > div {
      flex: 1 1 auto;
      min-width: 0;
    }
    #share-body pre,
    #share-body .transcript {
      margin: 0;
      font-family: inherit;
      font-size: inherit;
      line-height: inherit;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .status, .error {
      margin: 2.5rem auto 0;
      max-width: 28rem;
      text-align: center;
      color: var(--muted);
    }
    .error { color: #f3b4b4; }
    .hidden { display: none !important; }
    #share-body { user-select: text; -webkit-user-select: text; }
    mark.note-comment-hl {
      background: rgba(82, 158, 244, 0.14);
      color: inherit;
      border-radius: 2px;
      cursor: pointer;
      box-shadow: -4px 0 0 0 rgba(82, 158, 244, 0.72);
    }
    mark.note-comment-hl.is-active {
      background: rgba(82, 158, 244, 0.24);
      box-shadow: -4px 0 0 0 rgb(82, 158, 244);
    }
    .share-body-wrap {
      position: relative;
      overflow: visible;
    }
    .note-comment-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }
    .note-comment-overlay-hl {
      position: absolute;
      background: rgba(82, 158, 244, 0.14);
      border-radius: 2px;
      pointer-events: auto;
      cursor: pointer;
    }
    .note-comment-overlay-hl.is-active {
      background: rgba(82, 158, 244, 0.24);
    }
    .note-comment-overlay-bar {
      position: absolute;
      width: 3px;
      border-radius: 2px;
      background: rgba(82, 158, 244, 0.72);
      pointer-events: none;
    }
    .note-comment-overlay-bar.is-active {
      background: rgb(82, 158, 244);
    }
    .note-comment-bubble {
      position: fixed;
      z-index: 320;
      box-sizing: border-box;
      width: 32px;
      height: 32px;
      min-width: 32px;
      min-height: 32px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 50%;
      color: #fff;
      background: var(--accent);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
      cursor: pointer;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }
    .note-comment-bubble svg {
      display: block;
      pointer-events: none;
    }
    .share-comments-rail {
      min-width: 0;
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
    }
    .share-comments-list.is-anchored {
      display: block;
      position: relative;
    }
    .share-comments-list.is-anchored .share-comment {
      position: absolute;
      left: 0;
      right: 0;
    }
    .share-comments-title {
      margin: 0 0 0.75rem;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .share-comments-hint,
    .share-comments-error {
      margin: 0 0 0.75rem;
      color: var(--muted);
      font-size: 0.8125rem;
    }
    .share-comments-error { color: #f3b4b4; }
    .share-comments-list {
      position: relative;
      min-height: 2rem;
    }
    .share-comment {
      padding: 0.7rem 0.8rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
    }
    .share-comment.is-active {
      border-color: var(--accent);
      background: rgba(82, 158, 244, 0.12);
    }
    .share-comment-quote {
      margin: 0 0 0.45rem;
      color: var(--muted);
      font-size: 0.75rem;
      font-style: italic;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
    }
    .share-comment-head {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.35rem 0.75rem;
      margin-bottom: 0.35rem;
    }
    .share-comment-head strong { font-size: 0.8125rem; }
    .share-comment-head time { color: var(--muted); font-size: 0.75rem; }
    .share-comment-body {
      margin: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 0.875rem;
      line-height: 1.45;
    }
    .share-comment-delete {
      margin-top: 0.4rem;
      padding: 0;
      border: none;
      color: var(--muted);
      background: none;
      font: inherit;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .share-paie-thread {
      margin-top: 2rem;
      padding-top: 1.35rem;
      border-top: 1px solid var(--border);
      scroll-margin-top: 12px;
    }
    .share-paie-thread.hidden { display: none; }
    .share-paie-list {
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
    }
    .share-paie-group {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }
    .share-paie-msg.is-chair {
      background: rgba(82, 158, 244, 0.08);
    }
    .share-paie-msg.is-chair .share-comment-body {
      -webkit-user-select: text;
      user-select: text;
      cursor: text;
    }
    .share-paie-msg.is-reply {
      background: rgba(255, 255, 255, 0.04);
    }
    .share-paie-nested {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-left: 0.85rem;
    }
    .share-paie-comment-btn {
      padding: 0;
      border: none;
      color: var(--accent);
      background: none;
      font: inherit;
      font-size: 0.8125rem;
      cursor: pointer;
    }
    .share-paie-comment-form {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      margin-left: 0.85rem;
    }
    .share-paie-comment-form.hidden { display: none; }
    .share-paie-reply-form {
      margin-top: 0.9rem;
    }
    .share-comments-form {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      margin: 0 0 0.85rem;
      padding: 0.7rem 0.8rem;
      border: 1px solid var(--accent);
      border-radius: 12px;
      background: rgba(82, 158, 244, 0.1);
    }
    .share-comments-input {
      width: 100%;
      min-height: 4rem;
      padding: 0.5rem 0.6rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: inherit;
      background: var(--surface);
      font: inherit;
      resize: vertical;
    }
    .share-comments-btn {
      min-height: 36px;
      padding: 0.4rem 0.8rem;
      border: none;
      border-radius: 10px;
      color: #fff;
      background: var(--accent);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .share-comments-btn--ghost {
      color: var(--text);
      background: rgba(255, 255, 255, 0.08);
    }
    .share-comments-form-actions {
      display: flex;
      gap: 0.4rem;
    }
    @media (min-width: 960px) {
      .wrap.has-toc {
        display: grid;
        grid-template-columns: 16rem minmax(0, 46rem);
        gap: 1.5rem;
        align-items: start;
      }
      .wrap.has-comments {
        display: grid;
        grid-template-columns: minmax(0, 46rem) 18rem;
        gap: 1.5rem;
        align-items: start;
      }
      .wrap.has-toc.has-comments {
        grid-template-columns: 14rem minmax(0, 42rem) 18rem;
      }
      .wrap.has-toc .share-toc {
        position: sticky;
        top: 1.25rem;
        max-height: calc(100vh - 2.5rem);
        overflow-y: auto;
        margin-top: 0;
        padding-top: 0;
        border-top: 0;
      }
      .wrap.has-comments .share-comments-rail {
        margin-top: 0;
        padding-top: 0;
        border-top: 0;
        align-self: stretch;
        overflow: visible;
      }
      .wrap.has-toc .share-toc {
        margin: 0;
      }
      .wrap.has-comments .share-doc-row {
        grid-column: 1;
      }
      .wrap.has-toc.has-comments .share-doc-row {
        grid-column: 2;
      }
      .wrap.has-toc.has-comments .share-toc { grid-column: 1; grid-row: 1; }
      .wrap.has-comments .share-comments-rail { grid-column: 2; grid-row: 1; }
      .wrap.has-toc.has-comments .share-comments-rail { grid-column: 3; }
    }
    @media (min-width: 960px) {
      .note-comment-sheet { display: none !important; }
    }
    .note-comment-sheet {
      position: fixed;
      inset: 0;
      z-index: 420;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .note-comment-sheet.hidden { display: none !important; }
    .note-comment-sheet-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
    }
    .note-comment-sheet-panel {
      position: relative;
      z-index: 1;
      max-height: min(72dvh, 32rem);
      overflow: auto;
      padding: 0.5rem 1rem calc(1.25rem + env(safe-area-inset-bottom, 0px));
      border-radius: 16px 16px 0 0;
      background: var(--surface);
      box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.4);
    }
    .note-comment-sheet-handle {
      width: 36px;
      height: 4px;
      margin: 0.35rem auto 0.65rem;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.22);
    }
    .note-comment-sheet-close {
      display: block;
      width: 100%;
      margin: 0 0 0.75rem;
      padding: 0.55rem 0.75rem;
      border: none;
      border-radius: 10px;
      color: inherit;
      background: rgba(255, 255, 255, 0.08);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .note-comment {
      padding: 0.75rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
    }
    .note-comment-head {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.35rem 0.75rem;
      margin-bottom: 0.35rem;
    }
    .note-comment-head strong { font-size: 0.875rem; }
    .note-comment-head time { color: var(--muted); font-size: 0.75rem; }
    .note-comment-body {
      margin: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 0.9375rem;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <p id="share-status" class="status">Загрузка…</p>
    <p id="share-error" class="error hidden"></p>
    <nav id="share-toc" class="share-toc hidden" aria-label="Оглавление">
      <p class="share-toc-title">Оглавление</p>
      <div id="share-toc-list" class="share-toc-list"></div>
    </nav>
    <article id="share-doc" class="share-doc-row hidden">
      <p id="share-label" class="label"></p>
      <h1 id="share-title"></h1>
      <div id="share-actions" class="share-actions hidden"></div>
      <div id="share-body-wrap" class="share-body-wrap">
        <div id="share-body" class="note-body-html"></div>
        <div id="share-comment-overlay" class="note-comment-overlay"></div>
      </div>
      <section id="share-paie-thread" class="share-paie-thread hidden">
        <h2 class="share-comments-title">Комментарий CHAIR</h2>
        <div id="share-paie-list" class="share-paie-list"></div>
        <form id="share-paie-reply-form" class="share-comments-form share-paie-reply-form hidden">
          <textarea id="share-paie-reply-input" class="share-comments-input" rows="3" maxlength="4000" placeholder="Уточнение или дополнительная информация"></textarea>
          <div class="share-comments-form-actions">
            <button type="submit" class="share-comments-btn">Ответить</button>
          </div>
        </form>
      </section>
    </article>
    <aside id="share-comments" class="share-comments-rail hidden">
      <p id="share-comments-error" class="share-comments-error hidden"></p>
      <p id="share-comments-hint" class="share-comments-hint hidden"></p>
      <div id="share-comments-login" class="hidden">
        <p class="share-comments-hint">Чтобы комментировать, войдите через Telegram.</p>
        <button type="button" class="share-comments-btn" id="share-comments-login-btn">Войти через Telegram</button>
      </div>
      <form id="share-comments-form" class="share-comments-form hidden">
        <p id="share-comments-me" class="share-comments-hint"></p>
        <p id="share-comments-quote" class="share-comment-quote"></p>
        <textarea id="share-comments-input" class="share-comments-input" rows="3" maxlength="4000" placeholder="Комментарий к выделенному тексту"></textarea>
        <div class="share-comments-form-actions">
          <button type="submit" class="share-comments-btn">Отправить</button>
          <button type="button" class="share-comments-btn share-comments-btn--ghost" id="share-comments-cancel">Отмена</button>
        </div>
      </form>
      <div id="share-comments-list" class="share-comments-list"></div>
    </aside>
  </main>
  <script src="/webapp/note-html.js?v=20260908-moremenu"></script>
  <script src="/webapp/note-comments.js?v=20260908-moremenu"></script>
  <script src="/webapp/share.js?v=20260908-moremenu"></script>
</body>
</html>
