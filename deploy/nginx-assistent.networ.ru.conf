# assistent.networ.ru — TLS на этом хосте, бэкенд миниаппа локально (uvicorn :8080).
# Certbot дописывает listen 443 ssl и пути к сертификатам.

# Ограничение частоты с одного IP (leo_rl_*): общее щедрое — в офисе много людей за одним IP.
limit_req_zone $binary_remote_addr zone=leo_rl_all:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=leo_rl_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name assistent.networ.ru;
    server_tokens off;

    client_max_body_size 500m;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = / {
        return 302 /webapp/;
    }

    # Живые обновления мини-приложения (WebSocket).
    location = /api/miniapp/ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Внутренние эндпоинты (бот → веб-сервер) снаружи недоступны.
    location /internal/ {
        return 404;
    }
    # Вход по коду: перебор кодов.
    location ^~ /api/miniapp/auth/login-code {
        limit_req zone=leo_rl_login burst=5 nodelay;
        limit_req_dry_run on;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        limit_req zone=leo_rl_all burst=100 nodelay;
        limit_req_dry_run on;
        limit_req_status 429;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_buffering off;
    }
}
