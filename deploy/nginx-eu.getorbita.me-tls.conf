# eu.getorbita.me — TLS через проходку в КЗ (см. nginx-eu.getorbita.me.conf).
# Порт 8443 принимает только PROXY protocol от 72.56.10.65 (ufw пускает только его). Настоящий IP клиента
# берётся из PROXY protocol — лимиты leo_rl_*, лимит кодов почты и чат сайта видят человека, а не КЗ.
# Location-ы — как у getorbita.me (deploy/nginx-getorbita.me.conf); меняешь там — поменяй и здесь.
# Зоны leo_rl_* объявлены в nginx-assistent.networ.ru.conf.

server {
    listen 8443 ssl proxy_protocol;
    # HTTP/2: один TCP на браузер вместо ~6 — меньше упираемся в лимит соединений на IP в КЗ.
    http2 on;
    server_name eu.getorbita.me;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/eu.getorbita.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eu.getorbita.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    set_real_ip_from 72.56.10.65;
    real_ip_header proxy_protocol;

    client_max_body_size 64m;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml text/javascript application/manifest+json;

    location = / {
        rewrite ^ /orbita break;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /api/miniapp/ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /internal/ {
        return 404;
    }

    location ^~ /api/miniapp/auth/login-code {
        limit_req zone=leo_rl_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /api/miniapp/notes/transcriptions/upload {
        client_max_body_size 520m;
        proxy_pass http://127.0.0.1:8080;
        limit_req zone=leo_rl_all burst=100 nodelay;
        limit_req_status 429;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
    location = /api/miniapp/voice/transcribe {
        client_max_body_size 60m;
        proxy_pass http://127.0.0.1:8080;
        limit_req zone=leo_rl_all burst=100 nodelay;
        limit_req_status 429;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        limit_req zone=leo_rl_all burst=100 nodelay;
        limit_req_status 429;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_buffering on;
    }
}
