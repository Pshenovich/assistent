# eu.getorbita.me — запасной адрес для пользователей с VPN (2026-11-10).
# DNS eu.getorbita.me → 72.56.10.65 (второй IP сервера Obuchat в Алматы). Там nginx stream без расшифровки:
#   72.56.10.65:443 → сюда :8443 с PROXY protocol;  72.56.10.65:80 → сюда :80 как есть (для certbot).
# Эта часть — порт 80: выпуск сертификата и редирект на https. TLS-часть — nginx-eu.getorbita.me-tls.conf,
# её ставит scripts/setup_eu_edge.sh после выпуска сертификата.

server {
    listen 80;
    listen [::]:80;
    server_name eu.getorbita.me;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://eu.getorbita.me$request_uri;
    }
}
