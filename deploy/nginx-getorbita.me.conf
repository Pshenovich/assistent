# getorbita.me — новый домен Orbita: на главной лендинг (/orbita), остальное как у assistent.networ.ru.
# www → 301 на голый домен. Certbot дописывает listen 443 ssl и пути к сертификатам.
# Зоны leo_rl_* объявлены в nginx-assistent.networ.ru.conf (один раз на весь nginx).

server {
    listen 80;
    listen [::]:80;
    server_name www.getorbita.me;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://getorbita.me$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name getorbita.me;
    server_tokens off;

    client_max_body_size 64m;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml text/javascript application/manifest+json;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Главная — лендинг Orbita (на старом домене он живёт по /orbita).
    location = / {
        rewrite ^ /orbita break;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Живые обновления мини-приложения (WebSocket).
    location = /api/miniapp/ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Внутренние эндпоинты (бот → веб-сервер) снаружи недоступны.
    location /internal/ {
        return 404;
    }
    # Вход по коду: перебор кодов.
    location ^~ /api/miniapp/auth/login-code {
        limit_req zone=leo_rl_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # leo-perf: лимит загрузок — scripts/nginx_perf_patch.py
    # Запись встречи — большие файлы (приложение пишет их на диск); остальное — до 64m.
    location = /api/miniapp/notes/transcriptions/upload {
        client_max_body_size 520m;
        proxy_pass http://127.0.0.1:8080;
        limit_req zone=leo_rl_all burst=100 nodelay;
        limit_req_status 429;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
    location = /api/miniapp/voice/transcribe {
        client_max_body_size 60m;
        proxy_pass http://127.0.0.1:8080;
        limit_req zone=leo_rl_all burst=100 nodelay;
        limit_req_status 429;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
    # leo-perf end

    location / {
        proxy_pass http://127.0.0.1:8080;
        limit_req zone=leo_rl_all burst=100 nodelay;
        limit_req_status 429;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_buffering on;
    }
}
