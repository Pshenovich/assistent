# vault.getorbita.me — отдельный адрес сейфов (аудит 2026-11-10). Отдаёт только страницу сейфов и их API —
# это решает сам бэкенд (assistant/lib/vault_host.py), он же ставит строгий CSP. Certbot дописывает 443.
# Зоны leo_rl_* объявлены в nginx-assistent.networ.ru.conf.

server {
    listen 80;
    listen [::]:80;
    server_name vault.getorbita.me;
    server_tokens off;

    client_max_body_size 22m;  # шифр файла записи — до 20 МБ

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json text/javascript;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /internal/ {
        return 404;
    }

    # Вход по одноразовому коду и касания Touch ID: перебор.
    location ^~ /api/miniapp/vault-session {
        limit_req zone=leo_rl_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        limit_req zone=leo_rl_all burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
